name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'wrangler.toml'
      - 'workers/**'
  workflow_dispatch:

jobs:
  supabase-migrate:
    name: Push Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if migrations changed
        id: check_migrations
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_COMMIT" ]; then
            CHANGED_FILES=$(git diff --name-only "$PREV_COMMIT" HEAD)
          else
            CHANGED_FILES=$(git show --name-only --format="" HEAD)
          fi
          if echo "$CHANGED_FILES" | grep -q '^supabase/migrations/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No migration files modified in this commit. Skipping."
          fi

      - name: Setup Supabase CLI
        if: steps.check_migrations.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        if: steps.check_migrations.outputs.changed == 'true'
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice ::SUPABASE_DB_URL secret is not configured in repository settings. Skipping migration push."
            exit 0
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  supabase-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if functions changed
        id: check_functions
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_COMMIT" ]; then
            CHANGED_FILES=$(git diff --name-only "$PREV_COMMIT" HEAD)
          else
            CHANGED_FILES=$(git show --name-only --format="" HEAD)
          fi
          if echo "$CHANGED_FILES" | grep -q '^supabase/functions/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No edge function files modified in this commit. Skipping."
          fi

      - name: Setup Supabase CLI
        if: steps.check_functions.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        if: steps.check_functions.outputs.changed == 'true'
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice ::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF secret is not configured in repository settings. Skipping Edge Functions deployment."
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  cloudflare-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if worker changed
        id: check_worker
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_COMMIT" ]; then
            CHANGED_FILES=$(git diff --name-only "$PREV_COMMIT" HEAD)
          else
            CHANGED_FILES=$(git show --name-only --format="" HEAD)
          fi
          if echo "$CHANGED_FILES" | grep -E -q '^(workers/|wrangler\.toml)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No worker files modified in this commit. Skipping."
          fi

      - name: Check Cloudflare credentials
        if: steps.check_worker.outputs.changed == 'true'
        id: check_cf_creds
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice ::CF_API_TOKEN or CF_ACCOUNT_ID secret is not configured in repository settings. Skipping Cloudflare Worker deployment."
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy Cloudflare Worker
        if: steps.check_worker.outputs.changed == 'true' && steps.check_cf_creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
